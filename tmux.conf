# web-pi tmux.conf — applied to the app's tmux server at start (-f is read
# only when the server boots, i.e. on the first new-session; every tmux
# invocation from src/lib/tmux.ts carries it). Picked for browser-terminal
# (xterm.js) use; override location with WEB_PI_TMUX_CONF.

# Deliver ESC immediately — xterm.js has no legacy escape ambiguity, and the
# 500ms default makes Escape/Alt feel broken in TUIs (pi's own docs suggest
# ~10ms for local terminals).
set -g escape-time 10

# Deep scrollback: resumed sessions are searchable, and the (planned)
# capture-pane backfill on attach wants history to exist. 100k lines ≈ tens
# of MB per session ceiling, only allocated as used.
set -g history-limit 100000

# Let applications see focus enter/leave (pi's TUI uses it to pause
# spinner/progress redraws while you're in another tab).
set -g focus-events on

# True colour: the attach pty forces TERM=xterm-256color + COLORTERM, and
# tmux translates RGB for whatever TERM panes use. Without this, 24-bit
# colours quantise to the 256 palette.
set -as terminal-features ',xterm-256color:RGB'

# Mouse stays OFF, deliberately: xterm.js keeps native browser text
# selection + copy, and pi handles wheel scrolling itself in fullscreen
# mode. Flip this on together with pi `tuiMode: "regular"` if you'd rather
# have tmux-side wheel scrolling of scrollback (see TODO.md).
set -g mouse off
