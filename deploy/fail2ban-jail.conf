# fail2ban jail: watch the nginx access log for failed web-pi logins.
# Failed logins surface as 401 (bad credentials) or 429 (limiter tripped)
# on POST <base>/login in the nginx access log.

[webpi-auth]
enabled = true
filter = webpi-auth
logpath = /var/log/nginx/access.log
backend = auto
maxretry = 5
findtime = 600
bantime = 3600
