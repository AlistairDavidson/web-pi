# web-pi behind nginx with TLS + WebSocket upgrade.
#
# 1. Add the upgrade map at the TOP of the site file (http context,
#    outside server{}), if not already present:
#
#      map $http_upgrade $connection_upgrade {
#          default upgrade;
#          ''      close;
#      }
#
# 2. Add this location INSIDE the 443 server{} block. Adjust the path
#    (here /webpi/) to match WEB_PI_BASE, and the port to WEB_PI_PORT.
#    No auth_basic here — web-pi has its own login page. No new ports:
#    everything rides 443.

    location /webpi/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the real client IP to whatever the client sent. Run
        # web-pi with WEB_PI_TRUST_PROXY=1 so it rate-limits on that last
        # entry (one hop) — everything left of it is client-controlled.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # web-pi pings every open terminal socket every 30s, so idle
        # terminals stay up with any timeout above that.
        proxy_read_timeout 3600s;
        proxy_redirect off;

        client_max_body_size 1m;
    }
