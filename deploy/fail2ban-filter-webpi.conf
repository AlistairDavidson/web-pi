# Failed web-pi logins in the nginx access log (combined format).
# Install:  cp fail2ban-filter-webpi.conf /etc/fail2ban/filter.d/webpi-auth.conf
#           append the [webpi-auth] jail from fail2ban-jail.conf to
#           /etc/fail2ban/jail.local, then: systemctl restart fail2ban
# NOTE: adjust the POST path to match your WEB_PI_BASE (here /webpi/login).
# The datepattern line is required — {DATE} meta-pattern anchored to the
# [bracketed] date; without it fail2ban finds no date template and matches
# nothing.
[Definition]
datepattern = ^[^\[]*\[({DATE})
failregex = ^<HOST> .* "POST /webpi/login HTTP/[0-9.]+" (401|429)
ignoreregex =
